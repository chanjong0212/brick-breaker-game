<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>벽돌깨기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b1030;
    --panel: #2a1a4a;
    --line: #4a3378;
    --text: #fff4e6;
    --muted: #b7a6d9;
    --coral: #ff6b6b;
    --amber: #ffb84d;
    --mint: #4de0b0;
    --sky: #5ab8ff;
    --lilac: #b28cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(circle at 20% 0%, #33205e 0%, var(--bg) 55%);
    color: var(--text);
    font-family: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    display: flex; justify-content: center; padding: 24px 12px;
  }
  .app { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; align-items: flex-start; max-width: 860px; width: 100%; }
  h1 { font-size: 34px; margin: 0 0 4px; letter-spacing: 1px; }
  .stage { flex: 1 1 480px; max-width: 480px; }
  .hud { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-size: 18px; }
  .hud span b { color: var(--amber); font-weight: normal; }
  .hud .who { color: var(--mint); }
  .canvas-wrap { position: relative; border: 3px solid var(--line); border-radius: 18px; overflow: hidden; background: #150b26; box-shadow: 0 14px 40px rgba(0,0,0,.45); }
  canvas { display: block; width: 100%; height: auto; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; background: rgba(21,11,38,.86); padding: 24px; }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: 30px; }
  .overlay p { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.5; }
  input[type=text] { font: inherit; font-size: 20px; padding: 10px 14px; width: 220px; text-align: center; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); color: var(--text); }
  input[type=text]:focus-visible, button:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
  button { font: inherit; font-size: 20px; padding: 10px 26px; border: 0; border-radius: 12px; background: var(--amber); color: #3a1f00; cursor: pointer; box-shadow: 0 4px 0 #c4841f; }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #c4841f; }
  button.ghost { background: transparent; color: var(--muted); box-shadow: none; font-size: 16px; padding: 4px 10px; text-decoration: underline; }
  .win h2 { color: var(--mint); }
  .lose h2 { color: var(--coral); }
  .hint { margin-top: 8px; color: var(--muted); font-size: 15px; text-align: center; }
  .rank { flex: 1 1 260px; max-width: 320px; background: var(--panel); border: 3px solid var(--line); border-radius: 18px; padding: 18px; }
  .rank h2 { margin: 0 0 4px; font-size: 24px; }
  .status { font-size: 14px; color: var(--muted); margin-bottom: 10px; min-height: 18px; }
  .status.live::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--mint); margin-right: 6px; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  ol { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; font-size: 18px; }
  li:nth-child(odd) { background: rgba(255,255,255,.04); }
  li.me { background: rgba(77,224,176,.18); }
  li .n { width: 26px; height: 26px; border-radius: 50%; background: var(--line); display: grid; place-items: center; font-size: 14px; flex: none; }
  li:nth-child(1) .n { background: var(--amber); color: #3a1f00; }
  li:nth-child(2) .n { background: var(--lilac); color: #26124a; }
  li:nth-child(3) .n { background: var(--coral); color: #400a0a; }
  li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .pts { color: var(--amber); }
  .empty { color: var(--muted); padding: 12px 4px; font-size: 16px; }
  @media (prefers-reduced-motion: reduce) { .status.live::before { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <section class="stage">
    <h1>벽돌깨기</h1>
    <div class="hud">
      <span class="who" id="who">&nbsp;</span>
      <span>점수 <b id="score">0</b></span>
      <span>목숨 <b id="lives">3</b></span>
    </div>
    <div class="canvas-wrap">
      <canvas id="game" width="480" height="600" aria-label="벽돌깨기 게임 화면"></canvas>

      <div class="overlay" id="loginBox">
        <h2>이름을 입력하세요</h2>
        <p>이름으로 로그인하면 점수가 순위표에 기록돼요.</p>
        <input type="text" id="nameInput" maxlength="12" placeholder="예: 민지" autocomplete="off">
        <button id="loginBtn">로그인</button>
        <p id="loginErr" style="color:var(--coral);min-height:22px"></p>
      </div>

      <div class="overlay hidden" id="readyBox">
        <h2 id="readyTitle">준비됐나요?</h2>
        <p id="readyMsg">← → 방향키로 패들을 움직이고<br>스페이스바를 눌러 공을 발사하세요.</p>
        <button id="startBtn">게임 시작</button>
        <button class="ghost" id="logoutBtn">다른 이름으로 로그인</button>
      </div>

      <div class="overlay hidden" id="endBox">
        <h2 id="endTitle"></h2>
        <p id="endMsg"></p>
        <button id="retryBtn">다시 도전</button>
      </div>
    </div>
    <p class="hint">← → 이동 · 스페이스바 발사 / 일시정지</p>
  </section>

  <aside class="rank">
    <h2>실시간 순위 TOP 10</h2>
    <div class="status" id="dbStatus"></div>
    <ol id="rankList"></ol>
  </aside>
</div>

<script>
/* ============ Firebase 설정 ============ */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  databaseURL: "YOUR_DATABASE_URL",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
  appId: "YOUR_APP_ID"
};

/* ============ 데이터 계층 (Firebase / 로컬 대체) ============ */
const $ = id => document.getElementById(id);
const configured = firebaseConfig.apiKey !== "YOUR_API_KEY" && firebaseConfig.databaseURL !== "YOUR_DATABASE_URL";
let db = null, scoresRef = null, rankingBound = false;
let fbState = configured ? "loading" : "off"; // off | loading | ready | failed
const FB = "https://www.gstatic.com/firebasejs/10.12.2/";
const LOCAL_KEY = "brick_scores_local";
let player = null;

function loadScript(src) {
  return new Promise((res, rej) => {
    const el = document.createElement("script");
    el.src = src; el.onload = res; el.onerror = () => rej(new Error("스크립트 로드 실패: " + src));
    document.head.appendChild(el);
  });
}
// Firebase는 게임/로그인 코드와 별개로 비동기 로드 (로드가 느리거나 막혀도 버튼은 동작)
if (configured) {
  loadScript(FB + "firebase-app-compat.js")
    .then(() => loadScript(FB + "firebase-database-compat.js"))
    .then(() => {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      scoresRef = db.ref("scores");
      fbState = "ready";
      if (player) startRanking();
    })
    .catch(e => { console.error(e); fbState = "failed"; if (player) startRanking(); });
}

const keyOf = name => name.replace(/[.$#\[\]\/]/g, "_");

function renderRank(rows) {
  const list = $("rankList");
  list.innerHTML = "";
  if (!rows.length) {
    list.innerHTML = '<div class="empty">아직 기록이 없어요. 첫 번째 주인공이 되어보세요!</div>';
    return;
  }
  rows.forEach((r, i) => {
    const li = document.createElement("li");
    if (player && r.name === player) li.className = "me";
    const n = document.createElement("span"); n.className = "n"; n.textContent = i + 1;
    const nm = document.createElement("span"); nm.className = "name"; nm.textContent = r.name;
    const p = document.createElement("span"); p.className = "pts"; p.textContent = r.score;
    li.append(n, nm, p);
    list.appendChild(li);
  });
}

function localRows() {
  try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || []; } catch { return []; }
}

function startRanking() {
  const st = $("dbStatus");
  if (fbState === "ready" && scoresRef) {
    if (rankingBound) return;
    rankingBound = true;
    st.className = "status live";
    st.textContent = "Firebase 실시간 연결됨";
    scoresRef.orderByChild("score").limitToLast(10).on("value", snap => {
      const rows = [];
      snap.forEach(c => { const v = c.val(); rows.push({ name: v.name, score: v.score }); });
      rows.sort((a, b) => b.score - a.score);
      renderRank(rows);
    }, err => {
      st.className = "status";
      st.textContent = "순위를 불러오지 못했어요: " + err.message;
    });
    return;
  }
  st.className = "status";
  st.textContent = fbState === "loading" ? "Firebase에 연결하는 중…"
    : fbState === "failed" ? "Firebase 연결 실패 — 이 브라우저에만 저장돼요."
    : "Firebase 설정 전이라 이 브라우저에만 저장돼요.";
  renderRank(localRows().sort((a, b) => b.score - a.score).slice(0, 10));
}

async function saveScore(name, score) {
  if (score <= 0) return "기록할 점수가 없어요.";
  if (scoresRef) {
    try {
      const res = await scoresRef.child(keyOf(name)).transaction(cur => {
        if (cur && cur.score >= score) return; // 최고 기록만 유지
        return { name, score, updatedAt: firebase.database.ServerValue.TIMESTAMP };
      });
      return res.committed ? "새 최고 기록이 순위표에 저장됐어요!" : "이번 점수는 내 최고 기록보다 낮아요.";
    } catch (e) {
      return "점수 저장에 실패했어요: " + e.message;
    }
  }
  const rows = localRows();
  const mine = rows.find(r => r.name === name);
  let msg = "이번 점수는 내 최고 기록보다 낮아요.";
  if (!mine) { rows.push({ name, score }); msg = "점수가 이 브라우저에 저장됐어요."; }
  else if (mine.score < score) { mine.score = score; msg = "새 최고 기록이 저장됐어요!"; }
  localStorage.setItem(LOCAL_KEY, JSON.stringify(rows));
  renderRank(rows.sort((a, b) => b.score - a.score).slice(0, 10));
  return msg;
}

/* ============ 로그인 ============ */
function login(name) {
  player = name;
  try { localStorage.setItem("brick_player", name); } catch {}
  $("who").textContent = name + " 님";
  $("loginBox").classList.add("hidden");
  try { showReady(); } catch (e) { console.error(e); }
  try { startRanking(); } catch (e) { console.error(e); }
}
$("loginBtn").onclick = () => {
  const name = $("nameInput").value.trim();
  if (!name) { $("loginErr").textContent = "이름을 입력해 주세요."; return; }
  login(name);
};
$("nameInput").addEventListener("keydown", e => { e.stopPropagation(); if (e.key === "Enter") $("loginBtn").click(); });
$("logoutBtn").onclick = () => {
  try { localStorage.removeItem("brick_player"); } catch {}
  player = null; state = "login";
  $("who").innerHTML = "&nbsp;";
  $("readyBox").classList.add("hidden");
  $("loginBox").classList.remove("hidden");
  $("nameInput").focus();
};

/* ============ 게임 ============ */
const cv = $("game"), ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;
const COLORS = ["#ff6b6b", "#ffb84d", "#4de0b0", "#5ab8ff", "#b28cff"];
const COLS = 8, ROWS = 5, BW = 52, BH = 22, GAP = 6;
const OFFX = (W - (COLS * BW + (COLS - 1) * GAP)) / 2, OFFY = 70;

let state = "login"; // login | ready | play | pause | end
let score, lives, bricks, paddle, ball, keys = {};

function reset() {
  score = 0; lives = 3;
  paddle = { w: 90, h: 14, x: (W - 90) / 2, y: H - 40, speed: 7 };
  bricks = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      bricks.push({ x: OFFX + c * (BW + GAP), y: OFFY + r * (BH + GAP), c: COLORS[r], alive: true });
  resetBall();
  updateHud();
}
function resetBall() {
  ball = { x: paddle.x + paddle.w / 2, y: paddle.y - 9, r: 8, dx: 0, dy: 0, speed: 5, stuck: true };
}
function updateHud() { $("score").textContent = score; $("lives").textContent = lives; }

function launch() {
  const a = (Math.random() * 0.6 - 0.3);
  ball.dx = Math.sin(a) * ball.speed;
  ball.dy = -Math.cos(a) * ball.speed;
  ball.stuck = false;
}

function step() {
  if (keys.ArrowLeft) paddle.x -= paddle.speed;
  if (keys.ArrowRight) paddle.x += paddle.speed;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  if (ball.stuck) { ball.x = paddle.x + paddle.w / 2; ball.y = paddle.y - ball.r - 1; return; }

  ball.x += ball.dx; ball.y += ball.dy;
  if (ball.x < ball.r) { ball.x = ball.r; ball.dx = Math.abs(ball.dx); }
  if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.dx = -Math.abs(ball.dx); }
  if (ball.y < ball.r) { ball.y = ball.r; ball.dy = Math.abs(ball.dy); }

  // 패들 충돌: 맞은 위치에 따라 반사각 결정
  if (ball.dy > 0 && ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + 8 &&
      ball.x >= paddle.x - ball.r && ball.x <= paddle.x + paddle.w + ball.r) {
    const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
    const ang = hit * (Math.PI / 3);
    ball.dx = Math.sin(ang) * ball.speed;
    ball.dy = -Math.cos(ang) * ball.speed;
    ball.y = paddle.y - ball.r;
  }

  // 벽돌 충돌
  for (const b of bricks) {
    if (!b.alive) continue;
    if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + BW && ball.y + ball.r > b.y && ball.y - ball.r < b.y + BH) {
      b.alive = false;
      score += 10;
      const ox = Math.min(ball.x + ball.r - b.x, b.x + BW - (ball.x - ball.r));
      const oy = Math.min(ball.y + ball.r - b.y, b.y + BH - (ball.y - ball.r));
      if (ox < oy) ball.dx = -ball.dx; else ball.dy = -ball.dy;
      ball.speed = Math.min(9, ball.speed + 0.08);
      const m = Math.hypot(ball.dx, ball.dy);
      ball.dx = ball.dx / m * ball.speed; ball.dy = ball.dy / m * ball.speed;
      updateHud();
      break;
    }
  }

  if (bricks.every(b => !b.alive)) return finish(true);

  if (ball.y - ball.r > H) {
    lives--; updateHud();
    if (lives <= 0) return finish(false);
    resetBall();
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  for (const b of bricks) {
    if (!b.alive) continue;
    ctx.fillStyle = b.c;
    roundRect(b.x, b.y, BW, BH, 6); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.28)";
    roundRect(b.x + 4, b.y + 3, BW - 8, 5, 3); ctx.fill();
  }
  ctx.fillStyle = "#fff4e6";
  roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  ctx.fillStyle = "#ffb84d"; ctx.shadowColor = "#ffb84d"; ctx.shadowBlur = 14; ctx.fill(); ctx.shadowBlur = 0;
  if (state === "pause") {
    ctx.fillStyle = "rgba(21,11,38,.7)"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#fff4e6"; ctx.font = '34px "Jua", sans-serif'; ctx.textAlign = "center";
    ctx.fillText("일시정지", W / 2, H / 2);
  }
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function loop() {
  if (state === "play") step();
  draw();
  requestAnimationFrame(loop);
}

async function finish(won) {
  state = "end";
  if (won) score += lives * 50; // 남은 목숨 보너스
  updateHud();
  const box = $("endBox");
  box.className = "overlay " + (won ? "win" : "lose");
  $("endTitle").textContent = won ? "승리! 벽돌을 모두 깼어요" : "게임 오버";
  $("endMsg").textContent = "점수 " + score + (won ? " (남은 목숨 보너스 포함)" : "") + " · 저장 중…";
  const msg = await saveScore(player, score);
  $("endMsg").innerHTML = "점수 <b style='color:var(--amber);font-weight:normal'>" + score + "</b>" + (won ? " (남은 목숨 보너스 포함)" : "") + "<br>" + msg;
}

function showReady() {
  reset(); state = "ready";
  $("endBox").classList.add("hidden");
  $("readyBox").classList.remove("hidden");
}
function begin() {
  $("readyBox").classList.add("hidden");
  $("endBox").classList.add("hidden");
  state = "play";
  if (ball.stuck) launch();
}

$("startBtn").onclick = begin;
$("retryBtn").onclick = () => { reset(); begin(); };

window.addEventListener("keydown", e => {
  if (["ArrowLeft", "ArrowRight", " "].includes(e.key) && document.activeElement !== $("nameInput")) e.preventDefault();
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") keys[e.key] = true;
  if (e.key === " " && !e.repeat) {
    if (state === "ready") begin();
    else if (state === "play") { if (ball.stuck) launch(); else state = "pause"; }
    else if (state === "pause") state = "play";
    else if (state === "end") { reset(); begin(); }
  }
});
window.addEventListener("keyup", e => { keys[e.key] = false; });
window.addEventListener("blur", () => { keys = {}; if (state === "play" && !ball.stuck) state = "pause"; });

/* ============ 시작 ============ */
reset();
loop();
let saved = null;
try { saved = localStorage.getItem("brick_player"); } catch {}
if (saved) { login(saved); } else { startRanking(); $("nameInput").focus(); }
</script>
</body>
</html>
